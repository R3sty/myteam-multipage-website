<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./CSS/styles.css">
  <link rel="stylesheet" href="./CSS/contact.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bitcount+Grid+Single:wght@100..900&family=Handlee&family=Ibarra+Real+Nova:ital,wght@0,400..700;1,400..700&family=Livvic:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,900&family=Momo+Signature&family=Noto+Sans+JP:wght@100..900&family=Outfit:wght@100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Yesteryear&display=swap" rel="stylesheet">
  <script src="./JavaScript/component.js" defer></script>
  <script src="./JavaScript/script.js" defer></script>
  <title>Frontend Mentor | myteam website challenge - Contact</title>
</head>
<body>
  <site-header></site-header>
  
  <main>
    <div class="contact-case">
      <img src="./assets/bg-pattern-about-2-contact-1.svg" alt="background pattern" class="contact-pattern1">
      <div class="contact-content">
        <section>
          <h1>Contact</h1>
          <span class="highlight">Ask us about</span>
        </section>

        <div class="inner-content">
          <img src="./assets/icon-person.svg" alt="Person icon" class="card-icon">
          <p>The quality of our talent network</p>
        </div>

        <div class="inner-content">
          <img src="./assets/icon-cog.svg" alt="cog icon" class="card-icon">
          <p>Usage & implementation of our software</p>
        </div>

        <div class="inner-content">
          <img src="./assets/icon-chart.svg" alt="chart icon" class="card-icon">
          <p>How we help drive innovation</p>
        </div>
      </div>

      <form class="contact-form" action="#" method="post">
        <fieldset>
            <label for="name">Name</label>
            <input required type="text" id="name" name="name" placeholder="Name" pattern="[A-Za-z\s]+">
            <label for="email">Email Address</label>
            <input required type="email" id="email" name="email" placeholder="Email Address">
            <label for="company">Company Name</label>
            <input type="text" id="company" name="company" placeholder="Company Name">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Title">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Message" cols="60" rows="6"></textarea>
          </fieldset>
          <button type="submit" class="submit-btn">submit</button>
      </form>

      <img src="./assets/bg-pattern-contact-2.svg" alt="background pattern" class="contact-pattern2">
    </div>
    
  </main>
  
<site-footer></site-footer>
  
</body>
</html>
